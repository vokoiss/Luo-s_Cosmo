    .tree { padding: 8px 10px 14px; }

      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      cursor: pointer;
      border-radius: 10px;

      height: 0;

      border-bottom: 5px solid transparent;
      border-left: 7px solid #9a948a;

      flex-shrink: 0;

    .branch-title {

      font-size: 0.95rem;
      flex: 1;

    .leaves {

      display: flex;

      gap: 6px;

      gap: 8px;

    }

    function countKinds() {
      let core = 0, expand = 0;
      for (const m of MODULES) {
        for (const b of m.tree) {
          if (b.kind === "core") core++; else expand++;
          for (const leaf of b.leaves || []) {
            if (leaf.kind === "core") core++; else expand++;
          }
        }
      }
      return { core, expand };
    }

    function tagHtml(kind) {
      const text = kind === "core" ? "核心" : "发散";
      return `<span class="tag ${kind}">${text}</span>`;
    }

    function leafHtml(leaf) {
      const note = leaf.note ? `<span class="leaf-note">— ${escapeHtml(leaf.note)}</span>` : "";
      return `<div class="leaf">${tagHtml(leaf.kind)}<span class="leaf-label">${escapeHtml(leaf.label)}</span>${note}</div>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderPanel(mod) {
      const branches = mod.tree.map((b) => {
        const leaves = (b.leaves || []).map(leafHtml).join("");
        return `
          <details class="branch" open>
            <summary>
              <span class="chev" aria-hidden="true"></span>
              <span class="branch-title">${escapeHtml(b.title)}</span>
              ${tagHtml(b.kind)}
              <span class="count-pill">${(b.leaves || []).length}</span>
            </summary>
            <div class="leaves">${leaves}</div>
          </details>`;
      }).join("");

      return `
        <div class="panel-head">
          <span class="dot" style="background:${mod.color}"></span>
          <h2>${escapeHtml(mod.title)}</h2>
          <span class="count-pill">${mod.tree.length} 支</span>
        </div>
        <p class="panel-sum">${escapeHtml(mod.summary)}</p>
        <div class="tree">${branches}</div>`;
    }

    function setActive(id) {
      active = id;
      const mod = MODULES.find((m) => m.id === id) || MODULES[0];
      document.getElementById("panel").innerHTML = renderPanel(mod);
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.id === id);
      });
    }

    function init() {
      const counts = countKinds();
      document.getElementById("stats").innerHTML = `
        <div class="stat"><strong>${counts.core}</strong><span>核心节点</span></div>
        <div class="stat"><strong>${counts.expand}</strong><span>发散节点</span></div>
        <div class="stat"><strong>5</strong><span>一级模块</span></div>`;

      const tabs = document.getElementById("tabs");
      tabs.innerHTML = MODULES.map((m) =>
        `<button type="button" class="tab" role="tab" data-id="${m.id}">${escapeHtml(m.title)}</button>`
      ).join("");
      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest(".tab");
        if (btn) setActive(btn.dataset.id);
      });

      document.getElementById("map").innerHTML = MODULES.map((m) => `
        <button type="button" class="map-card" data-id="${m.id}">
          <strong><span class="dot" style="display:inline-block;vertical-align:middle;margin-right:6px;background:${m.color}"></span>${escapeHtml(m.title)}</strong>
          <ul>${m.tree.map((b) => `<li>${escapeHtml(b.title)}</li>`).join("")}</ul>
        </button>`).join("");
      document.getElementById("map").addEventListener("click", (e) => {
        const card = e.target.closest(".map-card");
        if (card) {
          setActive(card.dataset.id);
          document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      document.getElementById("expandAll").addEventListener("click", () => {
        document.querySelectorAll("#panel details.branch").forEach((d) => { d.open = true; });
      });
      document.getElementById("collapseAll").addEventListener("click", () => {
        document.querySelectorAll("#panel details.branch").forEach((d) => { d.open = false; });
      });

      setActive(active);
    }

    init();
  </script>
</body>
</html>
